<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="Y9sulVll1rdc_slAGcRVdZrMyOQJrcDFTts6DsmH8z0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>To Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
</head>

<body>
    <div class="todos-bg-container">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="todos-card">
                        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                            <i class="fas fa-moon" id="themeIcon"></i>
                        </button>
                        <h1 class="todos-heading fw-bold">TO DO <span>LIST</span></h1>
                        <h1 class="create-task-heading">Create <span class="create-task-heading-subpart">Task</span></h1>
                        <div class="input-btn-row">
                            <input type="text" id="todoUserInput" class="todos-user-input" placeholder="What needs to be done?">
                            <button class="add-todo-button" id="addTodoButton">ADD</button>
                        </div>
                        <h1 class="todo-items-heading">My <span class="todos-items-heading-subpart">Task</span></h1>
                        <ul class="todo-items-container" id="todoItemsContainer"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Santhosh To-Do List | Designed with &hearts; By Santhosh</p>
    </footer>
</body>

<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
